# Optional: when this repo is nested under clear-your-tools/, override the parent
# worktree patch so `cargo` uses this checkout (path ".") instead of chunk-your-skills-vX.Y.Z.
# Parent root must NOT define [patch.crates-io] for chunk-your-tools — that unrelated
# patch is what produces [[patch.unused]] noise in Cargo.lock (see DEV.md).
[patch.crates-io]
chunk-your-skills = { path = "." }
